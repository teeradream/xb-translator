name: Build XB Translator APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/XB-Translator.apk
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XB-Translator-APK
          path: dist/XB-Translator.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.1
          name: "XB Translator v1.0.1 (Liquid Glass UI, Remote Play, Gemini AI & Dual-Crop Translator)"
          body: |
            ### 🎮 XB Translator v1.0.1 (Android APK & Samsung DeX)

            แอปพลิเคชันสตรีมเกม **Xbox Series X|S / Xbox One (Remote Play)** และ **Xbox Cloud Gaming (xCloud)** พร้อมระบบแปลซับไตเติล เอกสารเฉพาะจุด และพากย์เสียงไทยแบบเรียลไทม์ในดีไซน์ **Liquid Glass**

            **ฟีเจอร์หลัก:**
            - **Xbox Remote Play & xCloud ในแอปเดียว:** เชื่อมต่อผ่าน `xbox.com/play` พร้อมติดตั้งสคริปต์ **Better xCloud** อัตโนมัติ (รองรับ Remote Play ความละเอียดสูงสุด 1080p)
            - **Liquid Glass UI & Spring Physics:** เมนูกระจกโปร่งแสงเด้งจากปุ่ม `☰`, ปุ่มลัดและหน้าต่างคำแปลโปร่งแสงพร้อมฟิสิกส์ยุบ/เด้งเมื่อแตะ
            - **Dual Crop Box (ซับไตเติล + แปลเฉพาะจุด):** แยกกรอบสีเขียว (อ่านซับต่อเนื่อง) และกรอบสีฟ้า (กดปุ่มไอคอนวงกลมเพื่อแปลเอกสาร/คำแนะนำ ปิดอัตโนมัติใน 20 วิ พร้อมปุ่ม `✕` และปุ่มฟังเสียงพากย์ ใช้งานได้แม้เปิดจอดำเต็มจอ)
            - **ลิ้นชักควบคุมด่วนด้านบน (Top Quick Drawer):** แตะหรือปัดแถบด้านบนเพื่อเปิด/ปิด **เสียงพากย์**, **เสียงเกม**, **ซับ**, และ **จอดำเต็มจอ** (ซ่อนอัตโนมัติใน 4 วิ)
            - **รองรับ Gemini API Key (เลือกใช้ได้):** แปลคำแสลง/คำสบถเป็นภาษาพูดไทยธรรมชาติ (`BLOCK_NONE`) + พากย์เสียง AI (สลับกลับระบบฟรีอัตโนมัติเมื่อไม่ใส่คีย์หรือโควตาเต็ม)
            - **Thai Voice Dubbing + 3-Mode TTS Queue:** พากย์เสียงไทยอัตโนมัติ ปรับความเร็ว `1.0x–1.5x` และเลือกคิวเสียง 3 โหมด (`อ่านจบประโยค`, `ทันใจตามซับใหม่`, `Smart Queue`) รองรับหูฟัง Bluetooth และจำการตั้งค่าทั้งหมดถาวร
          files: dist/XB-Translator.apk
          draft: false
          prerelease: false
