name: Build Xbox Translator APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Xbox-Translator.apk
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-Translator-APK
          path: dist/Xbox-Translator.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Xbox Translator v1.0.0 (Remote Play, xCloud, Real-Time Thai Subtitles & TTS)"
          body: |
            ### 🎮 Xbox Translator v1.0.0 (Android APK & Samsung DeX)

            แอปพลิเคชันสตรีมเกม **Xbox Series X|S / Xbox One (Remote Play)** และ **Xbox Cloud Gaming (xCloud)** พร้อมระบบแปลซับไตเติลและพากย์เสียงภาษาไทยแบบเรียลไทม์

            **ฟีเจอร์หลัก:**
            - **Xbox Remote Play & xCloud ในแอปเดียว:** เชื่อมต่อผ่าน `xbox.com/play` พร้อมติดตั้งสคริปต์ **Better xCloud** อัตโนมัติ (รองรับ Remote Play ความละเอียดสูงสุด 1080p)
            - **Smart Subtitle Cascade & Live Styling:** ซับเรียงซ้อน 3 แถวไล่ระดับความจาง ปรับสี/ขนาด/พื้นหลัง/ตำแหน่ง (กลางจอหรือล่างจอ) เห็นผลสดทันที
            - **No-Duplicate OCR & Translation:** ป้องกันการแปลซ้ำและพากย์ซ้ำกลางคัน
            - **Thai Voice Dubbing + 3-Mode TTS Queue:** พากย์เสียงไทยอัตโนมัติ ปรับความเร็ว `1.0x–1.5x` และเลือกโหมดคิวเสียงพากย์ 3 แบบ (`อ่านจบประโยค`, `ทันใจตามซับใหม่`, `Smart Queue`)
            - **Mute Game Audio & Text-Only Mode:** ปิดเฉพาะเสียงเกมในตัวสตรีมเพื่อฟังเสียงพากย์ไทยชัดๆ หรือเปิดโหมดจอดำแสดงเฉพาะซับไทย
            - **Samsung DeX & Multi-Window Support:** รองรับจอย Xbox / DualSense / Bluetooth และการใช้งานบน Samsung DeX
          files: dist/Xbox-Translator.apk
          draft: false
          prerelease: false
